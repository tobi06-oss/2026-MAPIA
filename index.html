function rid(n){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// 1순위: 기기끼리 직접 연결(PeerJS/WebRTC). 같은 와이파이면 잘 되지만 LTE끼리는 통신사 망이 막는 일이 많다.
// 2순위: 인터넷 중계(MQTT 공개 서버). 직접 연결이 7초 안에 안 열리면 자동으로 넘어감. 내용은 기기마다 따로 암호화(ECDH+AES).
const RELAYS=window.RELAY_TEST||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const ECDH={name:'ECDH',namedCurve:'P-256'},TE=new TextEncoder(),TD=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function roomTopic(code){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode(PREFIX+code)));return 'ojm1/'+[...h.slice(0,10)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function mkKeys(){const kp=await crypto.subtle.generateKey(ECDH,true,['deriveKey']);return{kp,pub:await crypto.subtle.exportKey('jwk',kp.publicKey)}}
async function derive(kp,jwk){const pk=await crypto.subtle.importKey('jwk',jwk,ECDH,false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj))))}}
async function unseal(key,m){return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},key,unb64(m.ct))))}
function whenMqtt(cb){if(window.mqtt)return cb();let n=0;const iv=setInterval(()=>{if(window.mqtt||++n>150){clearInterval(iv);if(window.mqtt)cb()}},200)}
function hostRelay(code,onMsg,onUp){
  const peers={},cl=[],hid=rid(8);let keys,top;
  whenMqtt(async()=>{keys=await mkKeys();top=await roomTopic(code);
    RELAYS.forEach((url,i)=>{const c=mqtt.connect(url,{clientId:'h'+rid(10),reconnectPeriod:3000,connectTimeout:8000,keepalive:30});cl[i]=c;
      c.on('connect',()=>{c.subscribe(top+'/h');onUp();c.publish(top+'/hb',JSON.stringify({up:hid}))});
      c.on('message',(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}if(!m||!m.from)return;const cid='mq'+i+':'+m.from;
        if(m.hello){derive(keys.kp,m.hello).then(k=>{peers[cid]={key:k,q:Promise.resolve(),rq:Promise.resolve(),i,from:m.from};c.publish(top+'/c/'+m.from,JSON.stringify({hi:keys.pub,hid}))}).catch(()=>{});return}
        if(m.bye){if(peers[cid]){delete peers[cid];onMsg(cid,{t:'gone'})}return}
        const p=peers[cid];if(!p){c.publish(top+'/c/'+m.from,JSON.stringify({rehello:1}));return}
        p.rq=p.rq.then(()=>unseal(p.key,m)).then(d=>onMsg(cid,d),()=>{})})})});
  // 집사가 새로고침·양도로 바뀌면 식구들이 다시 인사하도록 주기적으로 알림
  setInterval(()=>cl.forEach(c=>c&&c.connected&&c.publish(top+'/hb',JSON.stringify({up:hid}))),15000);
  return{send(cid,msg){const p=peers[cid];if(!p)return;p.q=p.q.then(()=>seal(p.key,msg)).then(e=>cl[p.i]&&cl[p.i].publish(top+'/c/'+p.from,JSON.stringify(e))).catch(()=>{})},ids:()=>Object.keys(peers)}}
function clientRelay(code,onMsg,onStatus){
  const me=rid(10);let c,key=null,keys,top,q=Promise.resolve(),rq=Promise.resolve(),bt,hostId=null;
  const hello=()=>c&&c.publish(top+'/h',JSON.stringify({from:me,hello:keys.pub}));
  function use(j){if(c)try{c.end(true)}catch(e){}
    c=mqtt.connect(RELAYS[j],{clientId:'c'+me+j,reconnectPeriod:3000,connectTimeout:8000,keepalive:20,will:{topic:top+'/h',payload:JSON.stringify({from:me,bye:1}),qos:0,retain:false}});const cc=c;
    clearTimeout(bt);bt=setTimeout(()=>{if(!key&&RELAYS.length>1)use((j+1)%RELAYS.length)},9000); // 이 중계에 집사가 없으면 다음 중계로
    cc.on('connect',()=>cc.subscribe([top+'/c/'+me,top+'/hb'],()=>hello()));
    cc.on('message',(t,buf)=>{if(cc!==c)return;let m;try{m=JSON.parse(buf.toString())}catch(e){return}
      if(m.up){if(hostId&&m.up!==hostId){key=null;hostId=null;onStatus(false);hello()}return}
      if(m.hi){clearTimeout(bt);hostId=m.hid;derive(keys.kp,m.hi).then(k=>{key=k;onStatus(true)});return}
      if(m.rehello){key=null;hello();return}
      if(key){const k=key;rq=rq.then(()=>unseal(k,m)).then(onMsg,()=>{})}});
    cc.on('offline',()=>{if(cc===c)onStatus(false)})}
  whenMqtt(async()=>{keys=await mkKeys();top=await roomTopic(code);use(0)});
  return{send(msg){if(!key)return;const k=key;q=q.then(()=>seal(k,msg)).then(e=>c.publish(top+'/h',JSON.stringify({from:me,...e}))).catch(()=>{})}}}
function hostTransport(code,onMsg,onStatus){
  const conns=new Map();
  if(LOCAL){const bc=new BroadcastChannel('mafia-'+code);
    bc.onmessage=e=>{const m=e.data;if(m.to!=='host')return;conns.set(m.from,1);onMsg(m.from,m.msg)};
    onStatus(true);return{send:(id,msg)=>bc.postMessage({to:id,msg}),ids:()=>[...conns.keys()]}}
  let peer,peerOK=false,relayOK=false;const st=(err)=>onStatus(peerOK||relayOK,err);
  function start(){peer=new Peer(PREFIX+code,PEER_OPT);
    peer.on('open',()=>{peerOK=true;st()});
    peer.on('connection',c=>{c.on('open',()=>conns.set(c.peer,c));c.on('data',d=>{conns.set(c.peer,c);onMsg(c.peer,d)});c.on('close',()=>{conns.delete(c.peer);onMsg(c.peer,{t:'gone'})})});
    peer.on('disconnected',()=>{peerOK=false;st();try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{peerOK=false;st(e.type);if(e.type==='unavailable-id'){setTimeout(()=>{peer.destroy();start()},3000)}else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setTimeout(()=>{if(peer.disconnected&&!peer.destroyed)try{peer.reconnect()}catch(x){}},2000)}});}
  if(window.Peer)start();
  const relay=hostRelay(code,onMsg,()=>{relayOK=true;st()});
  return{send:(id,msg)=>{if(id.startsWith('mq'))return relay.send(id,msg);const c=conns.get(id);if(c&&c.open)try{c.send(msg)}catch(e){}},ids:()=>[...conns.keys(),...relay.ids()]};
}
function clientTransport(code,onMsg,onStatus){
  if(LOCAL){const me=rid(8);const bc=new BroadcastChannel('mafia-'+code);bc.onmessage=e=>{if(e.data.to===me)onMsg(e.data.msg)};
    const send=msg=>bc.postMessage({to:'host',from:me,msg});setTimeout(()=>onStatus(true),50);return{send}}
  let peer,conn,timer,dialT,relay=null,mode='p2p',relT;
  function connect(){if(mode!=='p2p'||!peer||peer.destroyed)return;if(peer.disconnected){try{peer.reconnect()}catch(e){}}
    if(conn&&!conn.open)try{conn.close()}catch(e){}
    const c=peer.connect(PREFIX+code,{reliable:true});conn=c;if(NET.stage!=='relay')NET.stage='dial';draw();
    // 집사는 찾았는데 직접 연결(WebRTC)이 안 열리면 오류 없이 멈춰 있으므로, 10초 지나면 끊고 다시 시도
    clearTimeout(dialT);dialT=setTimeout(()=>{if(conn===c&&!c.open){NET.stage='ice';NET.fails++;draw();try{c.close()}catch(e){}retry()}},10000);
    c.on('open',()=>{if(conn!==c||mode!=='p2p')return;clearTimeout(dialT);clearTimeout(relT);NET.stage='ok';NET.fails=0;onStatus(true)});c.on('data',d=>{if(conn===c&&mode==='p2p')onMsg(d)});
    c.on('close',()=>{if(conn!==c||mode!=='p2p')return;onStatus(false);retry();laterRelay()});c.on('error',()=>{if(conn!==c||mode!=='p2p')return;onStatus(false);retry();laterRelay()})}
  function retry(){clearTimeout(timer);timer=setTimeout(connect,2500)}
  function laterRelay(){clearTimeout(relT);relT=setTimeout(goRelay,7000)}
  function goRelay(){if(relay||(conn&&conn.open&&mode==='p2p'))return;NET.stage='relay';draw();
    relay=clientRelay(code,d=>{if(mode==='relay')onMsg(d)},ok=>{if(ok&&mode!=='relay'){mode='relay';clearTimeout(timer);clearTimeout(dialT);try{peer&&peer.destroy()}catch(e){}}if(mode==='relay'){NET.stage=ok?'ok':'relay';NET.relay=true;onStatus(ok)}})}
  NET.stage='srv';laterRelay();
  if(window.Peer){peer=new Peer(PEER_OPT);peer.on('open',connect);peer.on('error',e=>{if(mode!=='p2p')return;if(e.type==='peer-unavailable')NET.stage='nohost';onStatus(false,e.type);if(e.type==='peer-unavailable')retry();else if(peer.disconnected)retry()});
    peer.on('disconnected',()=>{if(mode!=='p2p')return;onStatus(false);retry()})}
  // 화면 다시 켜면 즉시 재접속
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='p2p'&&(!conn||!conn.open))connect()});
  return{send:msg=>{if(mode==='relay')return relay.send(msg);if(conn&&conn.open)try{conn.send(msg)}catch(e){}}};
}

  const g=JSON.parse(JSON.stringify(G));g.players.forEach(p=>{if(!String(p.token).startsWith('bot-'))p.online=false});clearInterval(hostTick);HT.send(cid,{t:'takeover',g});

function addPlayer(token,name,intro,gender){let p=G.players.find(p=>p.token===token);if(!p){p={token,name,role:null,alive:true,intro:''};G.players.push(p)}else p.name=name;if(intro!==undefined)p.intro=String(intro).trim().slice(0,30);if(gender==='F'||gender==='M')p.gender=gender;return p}
function hostMsg(cid,m){
  if(m.t==='gone'){const t=conn2tok[cid];delete conn2tok[cid];const p=G.players.find(p=>p.token===t);if(p)p.online=false;broadcast();return}
  if(m.t==='join'){
    const name=String(m.name||'').trim().slice(0,12);
    G.alias=G.alias||{};if(G.alias[m.token])m.token=G.alias[m.token];
    const ex=G.players.find(p=>p.token===m.token);
    if(!ex){
      if(G.phase!=='lobby'){const old=G.players.find(p=>p.name===name&&!isBot(p));
        if(!old)return HT.send(cid,{t:'err',msg:'이미 놀이가 시작됐어요. 폰이나 브라우저를 바꿨다면 원래 이름 그대로 다시 입장하세요'});
        askTakeover(cid,m.token,old);return HT.send(cid,{t:'wait',msg:'집사가 자리 이어받기를 허락하면 들어갑니다…'})}
      if(!name)return HT.send(cid,{t:'err',msg:'이름을 입력하세요'});
      if(G.players.some(p=>p.name===name))return HT.send(cid,{t:'err',msg:'같은 이름이 있어요'});
    }else if(G.phase==='lobby'&&name&&G.players.some(p=>p.name===name&&p!==ex))return HT.send(cid,{t:'err',msg:'같은 이름이 있어요'});
    addPlayer(m.token,ex&&G.phase!=='lobby'?ex.name:(name||ex.name),m.intro,G.phase==='lobby'?m.gender:undefined);

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

    <div class="muted" style="margin-top:12px">🧪 테스트 모드: 컴퓨터 식구 9명과 한 판을 돌려 화면을 미리 볼 수 있어요.<br>🔊 소리는 집사 폰에서 크게 틀어두는 걸 추천해요. 배경음악은 집사 폰에서만 나오고, 놀이 시작 전, 그리고 밤에만 재생됩니다.</div>`;

  case 'settings':{const n=c.total||V.players.length,mx=maxMafia(n,c.gap);const st=(k,v)=>`<div class="step"><button class="wood" data-c="${k}" data-d="-1">−</button><b>${v}</b><button class="wood" data-c="${k}" data-d="1">+</button></div>`;

  const sendChat=()=>{const i=$('#chatin');if(i&&i.value.trim()){const t=i.value;i.value='';act({t:'chat',text:t})}};on('#chatsend','click',sendChat);$$('[data-q]').forEach(b=>b.onclick=()=>act({t:'chat',text:b.dataset.q}));on('#chatin','keydown',e=>{if(e.key==='Enter')sendChat()});
  on('#nsub','click',()=>{if(!voteSel)return;if(V.susPick){openM('sus',voteSel);return}const t=voteSel;voteSel=null;act({t:'night',target:t});sfx('moktak');draw()});
  $$('[data-sq]').forEach(b=>b.onclick=()=>{const i=$('#susin');if(i)i.value=b.dataset.sq});
  on('#sussend','click',()=>{const i=$('#susin');act({t:'night',target:modalArg,why:i?i.value:''});sfx('moktak');voteSel=null;modal=null;draw()});on('#m-notes','click',()=>openM('notes'));on('#sp-notes','click',()=>openM('notes'));
  const rc=$('.jobcard');if(rc){const showR=e=>{e.preventDefault();if(!peekRole){peekRole=true;draw()}},hideR=()=>{if(peekRole){peekRole=false;draw()}};
    rc.addEventListener('pointerdown',showR);rc.addEventListener('pointerup',hideR);rc.addEventListener('pointerleave',hideR);rc.addEventListener('pointercancel',hideR);rc.addEventListener('contextmenu',e=>e.preventDefault())}
  fit();
}
let lastPhase=null;
function buzz(){try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.5)}catch(e){}}
// 단계가 바뀌면 진동 + 선택 초기화 + 알맞은 두루마리 자동으로 열기
const _draw=draw;draw=function(){if(V&&V.phase!==lastPhase){if(lastPhase&&['vote','night','result','morning','end'].includes(V.phase))try{navigator.vibrate&&navigator.vibrate(300)}catch(e){};
  if(lastPhase&&isHost){const ph=V.phase;if(ph==='vote')sfx('gong');else if(ph==='night')sfx('owl');else if(ph==='result'){sfx('drum');setTimeout(()=>sfx('drum'),450)}else if(ph==='morning')sfx('chime');else if(ph==='end'){sfx('gong');setTimeout(()=>sfx('drum'),900)}else if(ph==='day'||ph==='roles')sfx('chime')}
  if(V.phase==='roles')ghostSeen=0;
  lastPhase=V.phase;voteSel=null;chatOpen=true;peekRole=false;modal={roles:'card',result:'result',morning:'morning',end:'end'}[V.phase]||null}
  syncNotes();_draw();bgmForPhase()};


/* ===== 소리 (Web Audio로 직접 합성: 징·북·도장·목탁·소쩍새·풍경, 가야금풍 배경음) ===== */
const SND={ctx:null,master:null,bgm:null,mode:null,timer:null};
function sndPref(k){const v=LS.get('snd-'+k);if(v!==null&&v!==undefined)return v;return true}
function audioUnlock(){try{if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;SND.ctx=new C();SND.master=SND.ctx.createGain();SND.master.gain.value=.9;SND.master.connect(SND.ctx.destination)}if(SND.ctx.state==='suspended')SND.ctx.resume()}catch(e){}}
document.addEventListener('pointerdown',audioUnlock,{capture:true});
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,t,a,peak,d,type,f2,dest){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);env(g,t,a,peak,d);o.connect(g);g.connect(dest||SND.master);o.start(t);o.stop(t+a+d+.05)}
function noise(t,d,peak,freq,q){const c=SND.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=c.createGain();env(g,t,.003,peak,d);n.connect(f);f.connect(g);g.connect(SND.master);n.start(t);n.stop(t+d)}
const SFX={
  gong(){const t=SND.ctx.currentTime;[[98,1,.5],[211,.5,.35],[307,.35,.3],[452,.2,.25]].forEach(([f,d,p])=>tone(f,t,.02,p,3.5*d+1.2,'sine',f*.985));noise(t,.15,.15,300,.7)},
  drum(){const t=SND.ctx.currentTime;tone(95,t,.005,.9,.45,'sine',48);noise(t,.08,.25,180,1)},
  stamp(){const t=SND.ctx.currentTime;tone(70,t,.003,1,.18,'sine',40);noise(t,.05,.5,900,.8)},
  moktak(){const t=SND.ctx.currentTime;tone(820,t,.002,.6,.12,'sine',760);tone(1640,t,.002,.15,.06)},
  owl(){const t=SND.ctx.currentTime;[0,1.1].forEach(o=>{tone(1150,t+o,.03,.25,.22,'sine',1080);tone(930,t+o+.38,.03,.25,.32,'sine',880)})},
  chime(){const t=SND.ctx.currentTime;[2093,3136,4186].forEach((f,i)=>tone(f,t+i*.07,.005,.12/(i+1),2.2))},
};
function sfx(name,always){if(!always&&!sndPref('sfx'))return;audioUnlock();if(!SND.ctx)return;try{SFX[name]()}catch(e){}}
// 가야금 느낌의 뜯는 소리 (Karplus-Strong)
function pluck(f,t,vol){const c=SND.ctx,sr=c.sampleRate,len=Math.floor(sr*2.2),b=c.createBuffer(1,len,sr),x=b.getChannelData(0),N=Math.floor(sr/f);
  for(let i=0;i<N;i++)x[i]=Math.random()*2-1;for(let i=N;i<len;i++)x[i]=(x[i-N]+x[i-N+1<len?i-N+1:i-N])*.497;
  const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=vol;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;s.connect(lp);lp.connect(g);g.connect(SND.bgm);s.start(t)}
const PENTA=[196,220,262,294,330,392,440,523,587];
function bgmStep(){if(!SND.ctx||!SND.bgm)return;const t=SND.ctx.currentTime+.05;
  if(SND.mode==='day'){if(!SND.i)SND.i=4;SND.i=Math.max(0,Math.min(PENTA.length-1,SND.i+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));pluck(PENTA[SND.i],t,.5);if(Math.random()<.25)pluck(PENTA[Math.max(0,SND.i-2)]/2,t+.18,.35);if(Math.random()<.15)pluck(PENTA[SND.i],t+.32,.25)}
  else if(SND.mode==='night'){if(Math.random()<.35)pluck([98,110,131,147][Math.floor(Math.random()*4)],t,.45);if(Math.random()<.12)[2093,3136].forEach((f,i)=>tone(f,t+i*.09,.005,.05,2.4,'sine',null,SND.bgm));if(Math.random()<.04)sfx('owl',true)}}
// 배경음악: 집사가 올린 두 곡을 번갈아 재생. 멈췄다 다시 틀면 처음부터가 아니라 멈춘 자리에서 이어감
const BGM=['snd/bgm1.mp3','snd/bgm2.mp3'];
function bgmSet(mode){if(!sndPref('bgm'))mode=null;if(!mode){bgmStop();return}
  if(!SND.el){SND.bi=0;SND.el=new Audio(BGM[0]);SND.el.preload='auto';SND.el.addEventListener('ended',()=>{SND.bi=(SND.bi+1)%BGM.length;SND.el.src=BGM[SND.bi];if(SND.mode)SND.el.play().catch(()=>{})})}
  SND.mode=mode;SND.el.volume=.45;if(SND.el.paused){const p=SND.el.play();if(p&&p.catch)p.catch(()=>{if(SND.waitTap)return;SND.waitTap=1;document.addEventListener('pointerdown',()=>{SND.waitTap=0;bgmForPhase()},{once:true})})}}
function bgmStop(){SND.mode=null;if(SND.el)SND.el.pause()}
function bgmForPhase(){if(!V||!isHost){bgmStop();return}bgmSet(V.phase==='night'?'night':V.phase==='lobby'?'day':null)} // 대기실과 밤에만(밤엔 폰 만지는 기척을 가려줌), 토론 중엔 조용히
let lastBeat=null;

/* ===== 시작: 새로고침해도 이어하기 ===== */
(function boot(){
  const r=LS.get('mafia-role');
  if(r&&r.host&&LS.get(HK)&&LS.get(HK).code===r.code){isHost=true;screen='game';if(LS.get('mafia-handed')){LS.del('mafia-handed');setTimeout(()=>alertBox('이제 이 폰이 집사요. 진행 버튼이 여기에 보여요.','👑 집사를 넘겨받았소'),900)}waitPeer(()=>hostStart(LS.get(HK)));return}
  if(r&&!r.host&&r.code&&(!params.get('room')||params.get('room').toUpperCase()===r.code)){screen='game';waitPeer(()=>{clientStart(r.code,LS.get('mafia-name')||'');draw()});return}
  const room=params.get('room');if(room)LS.set('pending-room',room.toUpperCase());
  if(room||STANDALONE&&LS.get('pending-room')){if(!LS.get('mafia-name')||!LS.get('mafia-gender')){nextAct='join';modal='profile'}else modal='join'}
  if(needInstall()){afterInstall={modal,nextAct};modal='install'}
  draw();
})();
