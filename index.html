#stage:after{content:"";position:absolute;inset:0;background:rgba(5,8,25,0);pointer-events:none;transition:background .8s;z-index:1}
#stage.night:after{background:rgba(5,8,25,.42)}
#stage>*{z-index:2}
#mroot{position:absolute;left:50%;top:50%;width:1024px;height:559px;transform-origin:center;pointer-events:none;color:#f3e6c8}
#mroot>*{pointer-events:auto}
#mroot .dim{position:absolute;inset:0}
#mroot.upright{position:fixed;left:0;top:0;width:100%;height:100%;transform:none}
#mroot.upright .modal{left:10px;right:10px;top:10px;width:auto;height:auto;max-height:calc(100% - 20px)}
#mroot.upright .mbody{font-size:17px}
h2,h3,.big,.code,button,.pname,.hud,.hud2,.jname,.sname,.jemo+.jname,.btxt,.logbox b,.sign{font-family:"궁서","궁서체","Gungsuh","GungSeo","Song Myung","Gowun Batang",serif;font-weight:400!important;-webkit-text-stroke:.7px currentColor;paint-order:stroke fill}
.paper,.logbox,.btxt,.sst,.psub,.mbody{font-family:"Hahmlet","Gowun Batang",serif;font-weight:600}
.paper b,.logbox b,.btxt b{font-weight:800}
button{border:0;cursor:pointer;font-weight:700;color:#fbecc9;border-radius:6px;font-size:17px;padding:8px 14px}
button:disabled{opacity:.45}
.wood{background:linear-gradient(#93673d,#6b4524);border:2px solid #3e2713;color:#fbecc9;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 6px rgba(0,0,0,.5);border-radius:6px}
button.red{background:linear-gradient(#b8432f,#87271c);border:2px solid #4a120c;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 6px rgba(0,0,0,.5)}
button.blue{background:linear-gradient(#336b88,#1f4a61);border:2px solid #0f2633;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 6px rgba(0,0,0,.5)}
.dark{background:rgba(18,14,10,.78);border:1px solid rgba(255,225,170,.28);border-radius:8px;color:#f3e6c8}
.sign{position:absolute;left:354px;top:25px;width:316px;height:118px;border-radius:5px;background:linear-gradient(180deg,#c49a63 0%,#b0834d 45%,#a47744 100%);border:3px solid #4a2e14;box-shadow:inset 0 0 0 2px rgba(255,235,190,.35),inset 0 -6px 10px rgba(60,30,10,.35),0 4px 8px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#24160a;pointer-events:none}
.sign:before,.sign:after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:#3b250f}.sign:before{left:9px}.sign:after{right:9px}
.sign .s1{font-size:21px;font-weight:700;letter-spacing:1px}.sign .s2{font-size:36px;font-weight:700;letter-spacing:1px;line-height:1.15;text-shadow:0 1px 0 rgba(255,230,180,.5)}
.ppanel{position:absolute;left:12px;top:10px;width:212px;padding:8px 10px;cursor:pointer}
.prow{display:flex;gap:10px;align-items:center}.pava{font-size:30px;width:44px;height:44px;border-radius:50%;background:#f1dfb8;display:flex;align-items:center;justify-content:center;border:2px solid #3e2713}
.pname{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}.psub{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fd38a;margin-left:2px}.dot.bad{background:#e5484d}
.logp{position:absolute;left:722px;top:8px;width:292px;height:124px;padding:12px 16px;background:linear-gradient(#f3e3bd,#e8d3a3);color:#2b2118;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.5);border-left:8px solid #7a5230;border-right:8px solid #7a5230}
.logbox{height:100%;overflow:auto;font-size:14px;line-height:1.5}
.lg-sys b{color:#3a3a3a}.lg-gong b{color:#1f4a61}.lg-night b{color:#87271c}.lg-end b{color:#6b4b25}.lg-pol{color:#1f4a61;font-weight:700}
.hud{position:absolute;left:50%;transform:translateX(-50%);top:150px;padding:5px 16px;font-size:17px;white-space:nowrap}
.hud2{position:absolute;left:50%;transform:translateX(-50%);top:190px;padding:6px 18px;font-size:22px;font-weight:700;white-space:nowrap}
.rd{color:#ff7b6b}.bl{color:#8cc8ea}
.slot{position:absolute;width:175px;display:flex;align-items:center;gap:7px;padding:5px 7px;cursor:pointer;transition:transform .1s}
.slot .ava{border-radius:50%;background:#f1dfb8;display:flex;align-items:center;justify-content:center;border:2px solid #6b4b25;flex:0 0 auto}
.slot .ava.f{background:#f7d9d2}
.slot.gone{opacity:.75}.slot.gone .ava{filter:grayscale(1);opacity:.6}
.slot.can{border-color:#f0b429;box-shadow:0 0 0 2px rgba(240,180,41,.6)}
.slot.picked{background:rgba(150,40,25,.92);border-color:#ffcf6b;transform:scale(1.04)}

/* ===== 연결 계층 ===== */
function hostTransport(code,onMsg,onStatus){
  const conns=new Map();
  if(LOCAL){const bc=new BroadcastChannel('mafia-'+code);
    bc.onmessage=e=>{const m=e.data;if(m.to!=='host')return;conns.set(m.from,1);onMsg(m.from,m.msg)};
    onStatus(true);return{send:(id,msg)=>bc.postMessage({to:id,msg}),ids:()=>[...conns.keys()]}}
  let peer,dead=false;
  function start(){peer=new Peer(PREFIX+code);
    peer.on('open',()=>onStatus(true));
    peer.on('connection',c=>{c.on('open',()=>conns.set(c.peer,c));c.on('data',d=>{conns.set(c.peer,c);onMsg(c.peer,d)});c.on('close',()=>{conns.delete(c.peer);onMsg(c.peer,{t:'gone'})})});
    peer.on('disconnected',()=>{onStatus(false);try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{onStatus(false,e.type);if(e.type==='unavailable-id'){setTimeout(()=>{peer.destroy();start()},3000)}else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setTimeout(()=>{if(peer.disconnected&&!peer.destroyed)try{peer.reconnect()}catch(x){}},2000)}});}
  start();
  return{send:(id,msg)=>{const c=conns.get(id);if(c&&c.open)try{c.send(msg)}catch(e){}},ids:()=>[...conns.keys()]};
}
function clientTransport(code,onMsg,onStatus){
  if(LOCAL){const me=rid(8);const bc=new BroadcastChannel('mafia-'+code);bc.onmessage=e=>{if(e.data.to===me)onMsg(e.data.msg)};
    const send=msg=>bc.postMessage({to:'host',from:me,msg});setTimeout(()=>onStatus(true),50);return{send}}
  let peer,conn,timer;
  function connect(){if(!peer||peer.destroyed)return;if(peer.disconnected){try{peer.reconnect()}catch(e){}}
    conn=peer.connect(PREFIX+code,{reliable:true});
    conn.on('open',()=>{onStatus(true)});conn.on('data',d=>onMsg(d));
    conn.on('close',()=>{onStatus(false);retry()});conn.on('error',()=>{onStatus(false);retry()})}
  function retry(){clearTimeout(timer);timer=setTimeout(connect,2500)}
  peer=new Peer();peer.on('open',connect);peer.on('error',e=>{onStatus(false,e.type);if(e.type==='peer-unavailable')retry();else if(peer.disconnected)retry()});
  peer.on('disconnected',()=>{onStatus(false);retry()});
  // 화면 다시 켜면 즉시 재접속
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!conn||!conn.open))connect()});
  return{send:msg=>{if(conn&&conn.open)try{conn.send(msg)}catch(e){}}};
}

let G=null, HT=null, hostTick=null;
const HK='mafia-host-state';
function defaultCfg(){return{mafia:2,gap:4,minutes:5,night:true,hostPlays:true,police:true,doctor:true,soldier:false,lastWords:30,flavor:true,apply:true,applyW:1.2,gonjang:3}}
function hostStart(resume){
  if(resume)resume.cfg=Object.assign(defaultCfg(),resume.cfg);
  G=resume||{code:rid(4),cfg:defaultCfg(),chat:[],players:[],phase:'lobby',round:0,log:[],votes:{},nightVotes:{},cands:[],revote:false,result:null,winner:null,endAt:0};
  LS.set('mafia-role',{host:true,code:G.code});
  if(!resume&&G.cfg.hostPlays)addPlayer(myToken,LS.get('mafia-name')||'방장',LS.get('mafia-intro')||'',LS.get('mafia-gender'));
  HT=hostTransport(G.code,hostMsg,(ok,err)=>{netOK=ok;netErr=err;if(ok)broadcast();else draw()});
  clearInterval(hostTick);hostTick=setInterval(hostTimer,500);
  hostSave();broadcast();
}
function hostSave(){LS.set(HK,G)}
const conn2tok={};
function addPlayer(token,name,intro,gender){let p=G.players.find(p=>p.token===token);if(!p){p={token,name,role:null,alive:true,intro:''};G.players.push(p)}else p.name=name;if(intro!==undefined)p.intro=String(intro).trim().slice(0,30);if(gender==='F'||gender==='M')p.gender=gender;return p}
function hostMsg(cid,m){
  if(m.t==='gone'){const t=conn2tok[cid];delete conn2tok[cid];const p=G.players.find(p=>p.token===t);if(p)p.online=false;broadcast();return}
  if(m.t==='join'){
    const name=String(m.name||'').trim().slice(0,12);
    const ex=G.players.find(p=>p.token===m.token);
    if(!ex){
      if(G.phase!=='lobby')return HT.send(cid,{t:'err',msg:'이미 게임이 시작됐어요'});
      if(!name)return HT.send(cid,{t:'err',msg:'이름을 입력하세요'});
      if(G.players.some(p=>p.name===name))return HT.send(cid,{t:'err',msg:'같은 이름이 있어요'});
    }
    addPlayer(m.token,ex&&G.phase!=='lobby'?ex.name:(name||ex.name),m.intro,G.phase==='lobby'?m.gender:undefined);
    conn2tok[cid]=m.token;G.players.find(p=>p.token===m.token).online=true;
    hostSave();broadcast();return}
  const tok=conn2tok[cid];if(tok)hostAct(tok,m);
}
function hostAct(tok,m){
  const p=G.players.find(p=>p.token===tok);if(!p)return;
  if(m.t==='leave'&&G.phase==='lobby'){G.players=G.players.filter(x=>x!==p);}
  if(m.t==='apply'&&G.phase==='lobby')p.apply=!!m.on;
  if(m.t==='vote'&&G.phase==='vote'&&p.alive&&!(tok in G.votes)&&G.cands.includes(m.target)&&m.target!==tok){
    G.votes[tok]=m.target;if(aliveP().every(x=>x.token in G.votes))countVotes()}
  if(m.t==='night'&&G.phase==='night'&&p.alive){const tgt=G.players.find(x=>x.token===m.target);
    if(tgt&&tgt.alive){const N=G.night;
      if(p.job==='mafia'&&!(tok in N.mafia)&&tgt.role!=='M')N.mafia[tok]=m.target;
      if(p.job==='police'&&!N.police&&tgt!==p)N.police={target:m.target,isM:tgt.role==='M'};
      if(p.job==='doctor'&&!N.doctor)N.doctor=m.target;
      if(nightLeft()===0)resolveNight()}}
  if(m.t==='chat'&&p.role==='M'&&p.alive&&G.phase==='night'){const t=String(m.text||'').trim().slice(0,120);if(t)G.chat.push({from:p.name,text:t,round:G.round})}
  hostSave();broadcast();
}
const aliveP=()=>G.players.filter(p=>p.alive);
const cntRole=r=>aliveP().filter(p=>p.role===r).length;
function recRange(n){const lo=Math.max(1,Math.ceil(n*0.2)),hi=Math.max(lo,Math.floor(n*0.3));return[lo,hi]}
function recMafia(n){const[a,b]=recRange(n);return a===b?a+'명':a+'~'+b+'명'}
function inRec(n,m){const[a,b]=recRange(n);return m>=a&&m<=b}
function fmtMin(m){return m<1?Math.round(m*60)+'초':(m%1?Math.floor(m)+'분 30초':m+'분')}
function applyOdds(n,m,w){if(n<2||m<1)return'';const base=m/n;let q=1; // 지원자 1명일 때 안 뽑힐 확률
  let rest=n-1;for(let k=0;k<m;k++){q*=rest/(rest+w);rest--}const p=1-q;return `💡 혼자 지원하면 자객 될 확률 약 ${Math.round(base*100)}% → ${Math.round(p*100)}% (지원자가 많을수록 효과는 줄어요)`}
function maxMafia(n,gap){return Math.max(0,Math.floor((n-gap)/2))}
function checkWin(){if(cntRole('M')===0)return'C';if(cntRole('M')>=cntRole('C'))return'M';return null}
function pname(t){const p=G.players.find(p=>p.token===t);return p?p.name:'?'}
function hostCmd(c){ // 방장 화면 버튼
  const g=G;
  if(c.k==='cfg'){Object.assign(g.cfg,c.v);if(c.v.hostPlays!==undefined){if(c.v.hostPlays)addPlayer(myToken,LS.get('mafia-name')||'방장',LS.get('mafia-intro')||'',LS.get('mafia-gender'));else g.players=g.players.filter(p=>p.token!==myToken)}}
  if(c.k==='kick'&&g.phase==='lobby')g.players=g.players.filter(p=>p.token!==c.v);
  if(c.k==='rename'){const p=g.players.find(p=>p.token===myToken);if(p&&c.v)p.name=c.v}
  if(c.k==='start'){const n=g.players.length,cf=g.cfg;
    // 자객 지원자는 가중치 applyW, 나머지는 1로 뽑기 (중복 없이)
    const pool=g.players.map(p=>({p,w:cf.apply&&p.apply?cf.applyW:1}));const mafiaSet=new Set();
    for(let k=0;k<cf.mafia&&pool.length;k++){let r=Math.random()*pool.reduce((a,x)=>a+x.w,0),i=0;while(i<pool.length-1&&(r-=pool[i].w)>0)i++;mafiaSet.add(pool[i].p);pool.splice(i,1)}
    const rest=[];['police','doctor','soldier'].forEach(j=>{if(cf[j]&&rest.length<n-cf.mafia)rest.push(j)});while(rest.length<n-cf.mafia)rest.push('citizen');shuffle(rest);
    const jobs=g.players.map(p=>mafiaSet.has(p)?'mafia':rest.pop());
    const used=new Set();
    const draw1=(gender,low)=>{const pool=gender==='F'?SINBUN.F:gender==='M'?SINBUN.M:SINBUN.F.concat(SINBUN.M);
      let c=shuffle(pool.filter(x=>!used.has(x[0])&&(!low||x[2])));if(!c.length)c=shuffle(pool.filter(x=>!used.has(x[0])));const x=c[0];if(!x)return null;used.add(x[0]);return{n:x[0],d:x[1]}};
    g.players.forEach((p,i)=>{p.job=jobs[i];p.role=JOBS[p.job].team;p.alive=true;p.armor=p.job==='soldier'?1:0;p.flavor=null});
    g.players.filter(p=>p.job==='mafia').forEach(p=>p.flavor=draw1(p.gender,true));
    g.players.filter(p=>p.job==='citizen').forEach(p=>p.flavor=draw1(p.gender,false));
    g.round=0;g.log=[];g.chat=[];g.winner=null;g.ending=null;g.stats={wrong:0,caught:0,mafia0:g.players.filter(x=>x.role==='M').length};g.phase='roles';}
  if(c.k==='day')startDay();
  if(c.k==='vote')startVote(false);
  if(c.k==='plus'&&g.phase==='day')g.endAt+=60000;
  if(c.k==='endvote'&&g.phase==='vote')countVotes();
  if(c.k==='next'){
    if(g.phase==='result'){if(g.result.revote)startVote(true);else{const w=checkWin();if(w)endGame(w);else if(g.cfg.night)startNight();else startDay()}}
    else if(g.phase==='morning'){const w=checkWin();if(w)endGame(w);else startDay()}
  }
  if(c.k==='endnight'&&g.phase==='night')resolveNight();
  if(c.k==='lobby'){g.phase='lobby';g.players.forEach(p=>{p.role=null;p.alive=true});g.winner=null}
  hostSave();broadcast();
}

function hoe(k,p){const L=[];HOE[k].forEach(x=>{const o=typeof x==='string'?{t:x}:x;for(let i=0;i<(o.a?3:1);i++)L.push(o)});const o=pick(L);
  return {t:o.t.replace(/\{n\}/g,p?p.name:'').replace(/\{f\}/g,p&&p.flavor?p.flavor.n:''),a:o.a||null}}
function hoeVote(p){if(p.role==='M')return hoe(p.flavor&&Math.random()<.5?'caughtCover':'caught',p);
  const sp={police:'wrongPolice',doctor:'wrongDoctor',soldier:'wrongSoldier'}[p.job];return hoe(sp&&Math.random()<.7?sp:'wrong',p)}
function hoeNight(p){const sp={police:'nightPolice',doctor:'nightDoctor',soldier:'nightSoldier'}[p.job];return hoe(sp?sp:'night',p)}

    else if(job==='doctor'){t=V.myNight?`🌿 오늘 밤 ${esc(pn(V.myNight))}님 곁에서 약을 달입니다`:'🌿 돌볼 사람을 고르세요 (자신도 가능)';b=!V.myNight&&sel?btn('nsub',`🌿 ${esc(sel)} 돌보기`,'red'):''}
    else{t='🌙 자시(子時)입니다. 눈을 감고 폰을 내려놓으시오';if(me&&me.role==='M')b=btn('m-chat','🤫 밀담')}
    return `<div class="btxt">${t}</div><div class="brow">${b}${hb}</div>`}

/* ---- 버튼 연결 ---- */
function on(id,ev,f){const e=$(id);if(e)e.addEventListener(ev,f)}
function keepForm(){const a=$('#nm'),b=$('#it'),c=$('#cd');if(a)LS.set('mafia-name',a.value);if(b)LS.set('mafia-intro',b.value);if(c)params.set('room',c.value)}
function openM(m,arg){modal=m;modalArg=arg;errMsg=errMsg;draw();if(m==='invite'){const q=$('#qr');if(q&&window.QRCode){try{new QRCode(q,{text:location.href.split('#')[0]+'#room='+V.code+(LOCAL?'&local=1':''),width:150,height:150})}catch(e){}}}}
function bind(){
  const needProfile=()=>!LS.get('mafia-name')||!LS.get('mafia-gender');
  const startHostFlow=(practice)=>{modal=null;isHost=true;screen='game';draw();waitPeer(()=>{if(!LOCAL&&!window.Peer){errMsg='연결 라이브러리를 못 불러왔어요. 인터넷을 확인하세요';screen='home';isHost=false;return draw()}hostStart();if(practice===true){G.cfg.minutes=1;G.cfg.lastWords=10;addBots(10)}})};
  on('#go-practice','click',()=>{errMsg='';if(needProfile()){nextAct='practice';return openM('profile')}startHostFlow(true)});
  on('#m-test','click',()=>openM('test'));$$('[data-scene]').forEach(b=>b.onclick=()=>{modal=null;testScene(b.dataset.scene)});on('#test-lobby','click',()=>{modal=null;cmd('lobby')});
  on('#bots-add','click',()=>{addBots(10);modal=null;draw()});on('#bots-del','click',()=>{removeBots();modal=null;draw()});
  on('#go-host','click',()=>{errMsg='';if(needProfile()){nextAct='host';return openM('profile')}startHostFlow()});

    const step=k==='applyW'?.1:k==='lastWords'?15:k==='minutes'&&(d<0?c[k]<=3:c[k]<3)?.5:1;let v=Math.round(Math.min(lim[1],Math.max(lim[0],c[k]+d*step))*100)/100;const patch={[k]:v};if(k==='gap')patch.mafia=Math.max(1,Math.min(c.mafia,maxMafia(n,v)));cmd('cfg',patch)});

let lastPhase=null;
function buzz(){try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.5)}catch(e){}}
// 단계가 바뀌면 진동 + 선택 초기화 + 알맞은 두루마리 자동으로 열기
const _draw=draw;draw=function(){if(V&&V.phase!==lastPhase){if(lastPhase&&['vote','night','result','morning','end'].includes(V.phase))try{navigator.vibrate&&navigator.vibrate(300)}catch(e){};
  if(lastPhase&&isHost){const ph=V.phase;if(ph==='vote')sfx('gong');else if(ph==='night')sfx('owl');else if(ph==='result'){sfx('drum');setTimeout(()=>sfx('drum'),450)}else if(ph==='morning')sfx('chime');else if(ph==='end'){sfx('gong');setTimeout(()=>sfx('drum'),900)}else if(ph==='day'||ph==='roles')sfx('chime')}
  lastPhase=V.phase;voteSel=null;peekRole=false;modal={roles:'card',result:'result',morning:'morning',end:'end'}[V.phase]||null}
  syncNotes();_draw();bgmForPhase()};


/* ===== 소리 (Web Audio로 직접 합성: 징·북·도장·목탁·소쩍새·풍경, 가야금풍 배경음) ===== */
const SND={ctx:null,master:null,bgm:null,mode:null,timer:null};
function sndPref(k){const v=LS.get('snd-'+k);if(v!==null&&v!==undefined)return v;return k==='bgm'?isHost:true}
function audioUnlock(){try{if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;SND.ctx=new C();SND.master=SND.ctx.createGain();SND.master.gain.value=.9;SND.master.connect(SND.ctx.destination)}if(SND.ctx.state==='suspended')SND.ctx.resume()}catch(e){}}
document.addEventListener('pointerdown',audioUnlock,{capture:true});
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,t,a,peak,d,type,f2,dest){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);env(g,t,a,peak,d);o.connect(g);g.connect(dest||SND.master);o.start(t);o.stop(t+a+d+.05)}
function noise(t,d,peak,freq,q){const c=SND.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=c.createGain();env(g,t,.003,peak,d);n.connect(f);f.connect(g);g.connect(SND.master);n.start(t);n.stop(t+d)}
const SFX={
  gong(){const t=SND.ctx.currentTime;[[98,1,.5],[211,.5,.35],[307,.35,.3],[452,.2,.25]].forEach(([f,d,p])=>tone(f,t,.02,p,3.5*d+1.2,'sine',f*.985));noise(t,.15,.15,300,.7)},
  drum(){const t=SND.ctx.currentTime;tone(95,t,.005,.9,.45,'sine',48);noise(t,.08,.25,180,1)},
  stamp(){const t=SND.ctx.currentTime;tone(70,t,.003,1,.18,'sine',40);noise(t,.05,.5,900,.8)},
  moktak(){const t=SND.ctx.currentTime;tone(820,t,.002,.6,.12,'sine',760);tone(1640,t,.002,.15,.06)},
  owl(){const t=SND.ctx.currentTime;[0,1.1].forEach(o=>{tone(1150,t+o,.03,.25,.22,'sine',1080);tone(930,t+o+.38,.03,.25,.32,'sine',880)})},
  chime(){const t=SND.ctx.currentTime;[2093,3136,4186].forEach((f,i)=>tone(f,t+i*.07,.005,.12/(i+1),2.2))},
};
function sfx(name,always){if(!always&&!sndPref('sfx'))return;audioUnlock();if(!SND.ctx)return;try{SFX[name]()}catch(e){}}
// 가야금 느낌의 뜯는 소리 (Karplus-Strong)
function pluck(f,t,vol){const c=SND.ctx,sr=c.sampleRate,len=Math.floor(sr*2.2),b=c.createBuffer(1,len,sr),x=b.getChannelData(0),N=Math.floor(sr/f);
  for(let i=0;i<N;i++)x[i]=Math.random()*2-1;for(let i=N;i<len;i++)x[i]=(x[i-N]+x[i-N+1<len?i-N+1:i-N])*.497;
  const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=vol;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;s.connect(lp);lp.connect(g);g.connect(SND.bgm);s.start(t)}
const PENTA=[196,220,262,294,330,392,440,523,587];
function bgmStep(){if(!SND.ctx||!SND.bgm)return;const t=SND.ctx.currentTime+.05;
  if(SND.mode==='day'){if(!SND.i)SND.i=4;SND.i=Math.max(0,Math.min(PENTA.length-1,SND.i+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));pluck(PENTA[SND.i],t,.5);if(Math.random()<.25)pluck(PENTA[Math.max(0,SND.i-2)]/2,t+.18,.35);if(Math.random()<.15)pluck(PENTA[SND.i],t+.32,.25)}
  else if(SND.mode==='night'){if(Math.random()<.35)pluck([98,110,131,147][Math.floor(Math.random()*4)],t,.45);if(Math.random()<.12)[2093,3136].forEach((f,i)=>tone(f,t+i*.09,.005,.05,2.4,'sine',null,SND.bgm));if(Math.random()<.04)sfx('owl',true)}}
function bgmSet(mode){if(!sndPref('bgm'))mode=null;if(mode===SND.mode&&SND.timer)return;bgmStop();if(!mode)return;audioUnlock();if(!SND.ctx)return;
  SND.mode=mode;SND.bgm=SND.ctx.createGain();SND.bgm.gain.value=mode==='night'?.55:.4;SND.bgm.connect(SND.master);
  if(mode==='night'){const c=SND.ctx;SND.drone=[73.4,110].map((f,i)=>{const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.frequency.value=f;g.gain.value=i?.03:.06;l.frequency.value=.08+i*.05;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(SND.bgm);o.start();l.start();return [o,l]})}
  SND.timer=setInterval(bgmStep,mode==='day'?750:1400)}
function bgmStop(){clearInterval(SND.timer);SND.timer=null;SND.mode=null;try{(SND.drone||[]).forEach(a=>a.forEach(o=>o.stop()))}catch(e){}SND.drone=null;if(SND.bgm){try{SND.bgm.disconnect()}catch(e){}SND.bgm=null}}
function bgmForPhase(){if(!V){bgmStop();return}bgmSet(V.phase==='night'?'night':['end'].includes(V.phase)?null:'day')}
let lastBeat=null;

/* ===== 시작: 새로고침해도 이어하기 ===== */
(function boot(){
  const r=LS.get('mafia-role');
  if(r&&r.host&&LS.get(HK)&&LS.get(HK).code===r.code){isHost=true;screen='game';waitPeer(()=>hostStart(LS.get(HK)));return}
  if(r&&!r.host&&r.code&&(!params.get('room')||params.get('room').toUpperCase()===r.code)){screen='game';waitPeer(()=>{clientStart(r.code,LS.get('mafia-name')||'');draw()});return}
  if(params.get('room')){if(!LS.get('mafia-name')||!LS.get('mafia-gender')){nextAct='join';modal='profile'}else modal='join'}
  draw();
})();
